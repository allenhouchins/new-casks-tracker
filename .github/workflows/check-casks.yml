name: Check for new casks

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: {} # allow manual runs (e.g. the first baseline run)

# Required so the workflow can push the updated state and site back to main.
permissions:
  contents: write

# Never let two runs race each other on the same state files.
concurrency:
  group: check-casks
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Check for new casks
        run: go run .

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update cask data ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
